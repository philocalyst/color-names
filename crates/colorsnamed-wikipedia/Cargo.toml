[package]
name = "colorsnamed-wikipedia"
version = "0.2.3"
edition = "2024"
description = "Color list: Wikipedia color names"
license = "MIT"
repository = "https://github.com/philocalyst/color-names"
readme = "../../README.md"
keywords = ["color", "name", "list"]
categories = ["visualization", "multimedia"]

[dependencies]
color = { workspace = true, optional = true }
rgb = { workspace = true }
serde = { workspace = true, optional = true }
palette = { workspace = true, optional = true }

[features]
default = ["color"]
serde = ["dep:serde"]
color = ["dep:color"]
palette = ["dep:palette"]

[build-dependencies]
colorsnamed-core = { workspace = true }

[lints]
workspace = true
